<div id="custom-modal" style="display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;padding:16px;">
  <div id="custom-modal-bg" style="position:absolute;inset:0;background:rgba(0,0,0,0.4);"></div>
  <div style="position:relative;width:88vw;max-width:320px;background:#FFFBF5;border-radius:16px;border:1px solid #E5D5C0;box-shadow:0 20px 60px rgba(0,0,0,0.2);padding:20px;display:grid;gap:16px;">
    <div style="font-size:14px;font-weight:900;letter-spacing:0.5px;">再次打卡</div>
    <div style="display:grid;gap:8px;">
      <label style="font-size:11px;font-weight:bold;color:#6B7280;">打卡日期</label>
      <input id="custom-date" type="date" style="height:44px;width:100%;border-radius:10px;border:1px solid #E5E7EB;padding:0 12px;font-size:14px;background:white;" />
    </div>
    <div style="display:grid;gap:8px;">
      <label style="font-size:11px;font-weight:bold;color:#6B7280;">心情筆記</label>
      <textarea id="custom-note" placeholder="今日天氣 / 心情 / 同行…" rows="3" style="width:100%;border-radius:10px;border:1px solid #E5E7EB;padding:12px;font-size:14px;background:white;resize:none;"></textarea>
    </div>
    <div style="display:flex;gap:8px;">
      <button onclick="window.closeCustomModal()" style="flex:1;height:44px;border-radius:10px;background:white;border:1px solid #E5E7EB;font-size:13px;font-weight:bold;">取消</button>
      <button onclick="window.confirmCustomModal()" style="flex:1;height:44px;border-radius:10px;background:#1B4332;color:white;font-size:13px;font-weight:bold;border:1px solid #1B4332;">確認打卡</button>
    </div>
  </div>
</div>
<script>
(function(){
  window.pendingTrailId=null;
  window.showCustomModal=function(id){
    try{
      window.pendingTrailId=id;
      var d=document.getElementById('custom-date');
      var n=document.getElementById('custom-note');
      var m=document.getElementById('custom-modal');
      if(d){var today=new Date().toISOString().slice(0,10);d.value=today;}
      if(n){n.value='';}
      if(m){m.style.display='flex';}
    }catch(e){alert('彈窗出錯:'+e.message)}
  };
  window.closeCustomModal=function(){
    var m=document.getElementById('custom-modal');
    if(m){m.style.display='none';}
    window.pendingTrailId=null;
  };
  window.confirmCustomModal=function(){
    try{
      var id=window.pendingTrailId;
      if(!id){window.closeCustomModal();return;}
      var dEl=document.getElementById('custom-date');
      var nEl=document.getElementById('custom-note');
      var d=dEl?dEl.value:'';
      var n=nEl?nEl.value:'';
      if(!d){var today=new Date().toISOString().slice(0,10);d=today;}
      var entry={date:d,note:n||'',notes:n||'',_id:Date.now().toString(36)};
      if(window._Su){
        window._Su(function(z){
          var cur=z[id]||[];
          var r={};for(var k in z)r[k]=z[k];
          r[id]=cur.concat([entry]);
          return r;
        });
      }else{
        // fallback to localStorage direct
        try{
          var raw=localStorage.getItem('hk-trails-multi');
          var obj=raw?JSON.parse(raw):{};
          var cur=obj[id]||[];
          obj[id]=cur.concat([entry]);
          localStorage.setItem('hk-trails-multi',JSON.stringify(obj));
          location.reload();
        }catch(e){alert('儲存出錯:'+e.message)}
      }
      window.closeCustomModal();
    }catch(e){alert('確認出錯:'+e.message)}
  };
  var bg=document.getElementById('custom-modal-bg');
  if(bg){bg.addEventListener('click', window.closeCustomModal);}
})();
</script>
